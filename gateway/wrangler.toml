name               = "gateway"
main               = "gateway.js"
compatibility_date = "2025-11-09"
# The Vertex account (not a personal one): the worker runs there and bills its Workers AI usage there.
account_id         = "ca34dd9af5abfcc04f41c6e0cea82da9"

# Secrets (set with `wrangler secret put <NAME>`, never commit them):
#   CF_API_TOKEN   - an API token with "Workers AI: Read" on the Vertex account (the single upstream credential every member shares)
#   ADMIN_TOKEN    - bearer token for the /admin/* routes (Firebase admin ID tokens also work)

[vars]
FIREBASE_PROJECT_ID = "vertex-ai-1618"
# Workers AI REST calls go to this account (same as account_id above; kept as a var so the code has it).
CF_ACCOUNT_ID       = "ca34dd9af5abfcc04f41c6e0cea82da9"
# Per-member monthly budget in USD.
MONTHLY_LIMIT_USD   = "25"
# Calendar month boundaries are computed in this zone.
QUOTA_TIMEZONE      = "Europe/Istanbul"
# Optional: comma-separated model ids or prefixes (e.g. "@cf/meta/,@cf/openai/gpt-oss-120b"). Empty = any priced model.
MODEL_ALLOWLIST     = ""
# Optional: JSON map rewriting incoming model names, e.g. {"llama":"@cf/meta/llama-3.3-70b-instruct-fp8-fast"}.
MODEL_ALIASES       = ""
# Optional: JSON price overrides in USD per million tokens, e.g. {"@cf/meta/llama-3.3-70b-instruct-fp8-fast":{"input":0.293,"output":2.253}}.
MODEL_PRICES        = ""

[durable_objects]
bindings = [
  { name = "REGISTRY", class_name = "Registry" },
  { name = "LEDGER",   class_name = "Ledger" }
]

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["Registry", "Ledger"]

[observability.logs]
enabled = true
