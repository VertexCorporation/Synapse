name               = "gateway"
main               = "gateway.js"
compatibility_date = "2025-11-09"

# Secrets (set with `wrangler secret put <NAME>`, never commit them):
#   OPENROUTER_KEY  - the single company OpenRouter key every member shares upstream
#   ADMIN_TOKEN     - bearer token for the /admin/* routes (Firebase admin ID tokens also work)

[vars]
FIREBASE_PROJECT_ID = "vertex-ai-1618"
OPENROUTER_BASE     = "https://openrouter.ai"
OPENROUTER_REFERER  = "https://vertexishere.com"
OPENROUTER_TITLE    = "Vertex Array Gateway"
# Per-member monthly budget in USD (OpenRouter credits are 1:1 with USD).
MONTHLY_LIMIT_USD   = "25"
# Calendar month boundaries are computed in this zone.
QUOTA_TIMEZONE      = "Europe/Istanbul"
# Optional: comma-separated model ids or prefixes (e.g. "anthropic/,openai/gpt-4o"). Empty = any model.
MODEL_ALLOWLIST     = ""
# Optional: JSON map rewriting incoming model names, e.g. {"claude-sonnet-4-5":"anthropic/claude-sonnet-4.5"}.
MODEL_ALIASES       = ""

[durable_objects]
bindings = [
  { name = "REGISTRY", class_name = "Registry" },
  { name = "LEDGER",   class_name = "Ledger" }
]

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["Registry", "Ledger"]

[observability.logs]
enabled = true
